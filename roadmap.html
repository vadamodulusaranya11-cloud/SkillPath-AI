<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>SkillPath AI - 30 Day Roadmap</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f3f4ff;
    color: #222;
}

header {
    background: #25256b;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #ddd;
}

h2 {
    color: #25256b;
}

select, button {
    padding: 12px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
}

select {
    width: 100%;
    border: 1px solid #ccc;
    margin: 10px 0;
}

button {
    background: #25256b;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #4545a5;
}

.progress-bg {
    background: #ddd;
    height: 15px;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    background: #28a745;
    height: 100%;
    width: 0%;
}

.day {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 8px;
    margin: 12px 0;
}

.day.completed {
    border-left: 6px solid green;
    background: #effff2;
}

.question {
    margin: 20px 0;
}

.option {
    display: block;
    padding: 10px;
    margin: 7px 0;
    background: #f1f1ff;
    border-radius: 6px;
    cursor: pointer;
}

#quizBox {
    display: none;
}

#result {
    font-weight: bold;
    margin-top: 15px;
}
</style>
</head>

    </select>
</div>

<div class="card">
    <h2>Your Learning Progress</h2>

<div class="card">

let currentDay = 0;
let currentQuestions = [];

function getStudentKey() {
    let student = JSON.parse(localStorage.getItem("studentData") || "{}");
    return student.email || student.name || "guest";
}

function getProgress() {
    return JSON.parse(
        localStorage.getItem("roadmapProgress_" + getStudentKey()) || "{}"
    );
}

function saveProgress(progress) {
    localStorage.setItem(
        "roadmapProgress_" + getStudentKey(),
        JSON.stringify(progress)
    );
}

function loadRoadmap() {

    let career = document.getElementById("career").value;
    let roadmap = document.getElementById("roadmap");
    let progress = getProgress();

    roadmap.innerHTML = "";

    plans[career].forEach((topic, index) => {

        let completed = progress[index + 1] === true;

        roadmap.innerHTML += `
        <div class="day ${completed ? 'completed' : ''}">
            <h3>Day ${index + 1}: ${topic}</h3>
            <p>${completed ? '✅ Completed' : '📘 Learn this topic and take the quiz.'}</p>
            <button onclick="startQuiz(${index})"
            ${completed ? 'disabled' : ''}>
                ${completed ? 'Completed' : 'Take Verification Quiz'}
            </button>
        </div>
        `;
    });

    updateProgress();
}

function updateProgress() {

    let progress = getProgress();
    let count = Object.values(progress).filter(v => v === true).length;

    document.getElementById("progressText").innerText =
        count + " / 30 Days Completed";

    document.getElementById("progressBar").style.width =
        (count / 30 * 100) + "%";
}


function startQuiz(dayIndex) {

    currentDay = dayIndex;

    let career = document.getElementById("career").value;
    let question = concepts[career][dayIndex];

    currentQuestions = [

        {
            q: question[1],
            options: [question[2], question[3], question[4]],
            answer: 0
        },

        {
            q: "Which option is related to " + question[0] + "?",
            options: [question[2], question[4], question[3]],
            answer: 0
        },

        {
            q: "Why is " + question[0] + " important?",
            options: [
                question[3],
                "It helps apply the concept correctly",
                question[4]
            ],
            answer: 1
        }

    ];

    let html = "";

    currentQuestions.forEach((q, index) => {

        html += `
        <div class="question">
            <h3>${index + 1}. ${q.q}</h3>
        `;

        q.options.forEach((option, i) => {

            let safeOption = option
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            html += `
            <label class="option">
                <input type="radio"
                name="question${index}"
                value="${i}">
                ${safeOption}
            </label>
            `;
        });

        html += `</div>`;
    });

    document.getElementById("quizTitle").innerText =
        "Day " + (dayIndex + 1) + " Verification Quiz";

    document.getElementById("questions").innerHTML = html;

    document.getElementById("result").innerText = "";

    document.getElementById("quizBox").style.display = "block";

    document.getElementById("quizBox").scrollIntoView({
        behavior: "smooth"
    });
}


function checkAnswers() {

    let score = 0;
    let reviewHTML = "";

    for (let i = 0; i < 3; i++) {

        let selected = document.querySelector(
            'input[name="question' + i + '"]:checked'
        );

        if (!selected) {
            alert("Please answer all questions!");
            return;
        }

        let chosen = Number(selected.value);
        let correct = currentQuestions[i].answer;

        if (chosen === correct) {
            score++;

            reviewHTML += `
            <p style="color:green;">
            ✅ Question ${i + 1}: Correct!
            </p>`;
        } else {

            reviewHTML += `
            <p style="color:red;">
            ❌ Question ${i + 1}: Wrong Answer
            </p>
            <p style="color:green;">
            Correct Answer: ${currentQuestions[i].options[correct]}
            </p>`;
        }
    }

    if (score >= 2) {

        let progress = getProgress();
        progress[currentDay + 1] = true;
        saveProgress(progress);

        reviewHTML += `
        <h3 style="color:green;">
        🎉 Congratulations! Day Completed!
        </h3>`;

        loadRoadmap();

    } else {

        reviewHTML += `
        <h3 style="color:red;">
        ❌ Not Passed! Try Again.
        </h3>`;
    }

    reviewHTML += `<h3>Your Score: ${score}/3</h3>`;

    document.getElementById("questions").innerHTML = reviewHTML;
    document.getElementById("result").innerHTML = "";
}

loadRoadmap();

</script>
